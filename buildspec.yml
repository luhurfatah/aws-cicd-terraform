version: 0.2

phases:
  pre_build:
    commands:
      - apt-get update
      - apt-get install -y python3-pip
      - pip3 install awscli
      - pip3 install boto3
      - wget https://releases.hashicorp.com/terraform/0.15.5/terraform_0.15.5_linux_amd64.zip
      - unzip terraform_0.15.5_linux_amd64.zip
      - mv terraform /usr/local/bin/
      
  build:
    commands:
      - cd apps
      - npm install
      - zip -r app.zip *

  post_build:
    commands:
      - cd ..
      - cp apps/app.zip infra/main/app-${CODEBUILD_RESOLVED_SOURCE_VERSION}.zip
      - sed -i 's/app-<COMMIT-HASH>/app-'"$CODEBUILD_RESOLVED_SOURCE_VERSION"'/g' infra/main/main.tf
      - sed -i 's/<SECRET_NAME>/'"$SECRET_NAME"'/g' scripts/retrieveSecret.py
      - sed -i 's/<SECRET_NAME>/'"$SECRET_NAME"'/g' scripts/updateSecret.py
      - DB_HOST=$(python3 scripts/retrieveSecret.py --group db_credentials --key db_host)
      - DB_USER=$(python3 scripts/retrieveSecret.py --group db_credentials --key username)
      - DB_PASS=$(python3 scripts/retrieveSecret.py --group db_credentials --key password)
      - DB_NAME=$(python3 scripts/retrieveSecret.py --group db_credentials --key db_name)
      - sed -i 's/<DB_HOST>/app-'"$DB_HOST"'/g' infra/main/main.tf
      - sed -i 's/<DB_USER>/app-'"$DB_USER"'/g' infra/main/main.tf
      - sed -i 's/<DB_PASS>/app-'"$DB_PASS"'/g' infra/main/main.tf
      - sed -i 's/<DB_NAME>/app-'"$DB_NAME"'/g' infra/main/main.tf
      - TEMP_ACCESS_KEY=$(python3 scripts/retrieveSecret.py --group aws_temp_credentials --key access_key)
      - TEMP_SECRET_KEY=$(python3 scripts/retrieveSecret.py --group aws_temp_credentials --key secret_key)
      - TEMP_TOKEN=$(python3 scripts/retrieveSecret.py --group aws_temp_credentials --key token)
      - aws configure set aws_access_key_id $TEMP_ACCESS_KEY
      - aws configure set aws_secret_access_key $TEMP_SECRET_KEY
      - aws configure set aws_session_token $TEMP_TOKEN
      - terraform apply --auto-approve

image: node:14-alpine
